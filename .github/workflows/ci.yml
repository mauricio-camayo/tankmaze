name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.12'
          cache: false

      - name: Build
        run: |
          (cd packages/sdk && go build ./...)
          (cd packages/backend && go build ./...)

      - name: Test
        run: |
          (cd packages/sdk && go test ./...)
          pkgs=$(cd packages/backend && go list ./... 2>/dev/null)
          if [ -n "$pkgs" ]; then (cd packages/backend && go test ./...); fi

      - name: Vet
        run: |
          (cd packages/sdk && go vet ./...)
          pkgs=$(cd packages/backend && go list ./... 2>/dev/null)
          if [ -n "$pkgs" ]; then (cd packages/backend && go vet ./...); fi

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  infrastructure:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [backend, frontend, infrastructure]
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Diff
        run: pnpm cdk diff

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend, infrastructure]
    env:
      GOTOOLCHAIN: local
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.12'
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            packages/frontend/pnpm-lock.yaml
            packages/infrastructure/pnpm-lock.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build AI tank WASMs
        run: |
          for verdir in packages/infrastructure/lib/ai-tanks/*/*/; do
            tank=$(basename $(dirname $verdir))
            ver=$(basename $verdir)
            (
              cd packages/testdata/tanks/$tank
              GOOS=wasip1 GOARCH=wasm GOWORK=off \
                go build -o ../../../infrastructure/lib/ai-tanks/$tank/$ver/tank.wasm .
            )
            echo "compiled $tank/$ver"
          done

      - name: Deploy infrastructure
        working-directory: packages/infrastructure
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          SITE_CERTIFICATE_ARN: ${{ secrets.SITE_CERTIFICATE_ARN }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
          # GitHub reserves the GITHUB_ secret-name prefix for its own
          # automatic secrets, so this repo's GitHub OAuth App credentials
          # are stored as GH_CLIENT_ID/GH_CLIENT_SECRET instead (item 233).
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          CONTEXT_FLAGS="--context userPoolId=$VITE_USER_POOL_ID --context userPoolClientId=$VITE_USER_POOL_CLIENT_ID"
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context googleClientId=$GOOGLE_CLIENT_ID --context googleClientSecret=$GOOGLE_CLIENT_SECRET"
          fi
          if [ -n "$FACEBOOK_APP_ID" ] && [ -n "$FACEBOOK_APP_SECRET" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context facebookAppId=$FACEBOOK_APP_ID --context facebookAppSecret=$FACEBOOK_APP_SECRET"
          fi
          if [ -n "$SITE_CERTIFICATE_ARN" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context certificateArn=$SITE_CERTIFICATE_ARN"
          fi
          if [ -n "$SES_SENDER_EMAIL" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context sesSenderEmail=$SES_SENDER_EMAIL"
          fi
          if [ -n "$GH_CLIENT_ID" ] && [ -n "$GH_CLIENT_SECRET" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context githubClientId=$GH_CLIENT_ID --context githubClientSecret=$GH_CLIENT_SECRET"
          fi
          if [ -n "$DISCORD_CLIENT_ID" ] && [ -n "$DISCORD_CLIENT_SECRET" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context discordClientId=$DISCORD_CLIENT_ID --context discordClientSecret=$DISCORD_CLIENT_SECRET"
          fi
          if [ -n "$OPS_ALERT_EMAIL" ]; then
            CONTEXT_FLAGS="$CONTEXT_FLAGS --context opsAlertEmail=$OPS_ALERT_EMAIL"
          fi
          pnpm cdk deploy --all --require-approval never $CONTEXT_FLAGS

      - name: Build frontend
        working-directory: packages/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_WS_ENDPOINT: ${{ secrets.VITE_WS_ENDPOINT }}
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync packages/frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
