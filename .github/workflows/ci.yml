name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build
        run: |
          (cd packages/sdk && go build ./...)
          (cd packages/backend && go build ./...)

      - name: Test
        run: |
          (cd packages/sdk && go test ./...)
          pkgs=$(cd packages/backend && go list ./... 2>/dev/null)
          if [ -n "$pkgs" ]; then (cd packages/backend && go test ./...); fi

      - name: Vet
        run: |
          (cd packages/sdk && go vet ./...)
          pkgs=$(cd packages/backend && go list ./... 2>/dev/null)
          if [ -n "$pkgs" ]; then (cd packages/backend && go vet ./...); fi

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: packages/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  infrastructure:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: packages/infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [backend, frontend, infrastructure]
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: packages/infrastructure/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Diff
        run: pnpm cdk diff

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend, infrastructure]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            packages/frontend/pnpm-lock.yaml
            packages/infrastructure/pnpm-lock.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda binaries
        working-directory: packages/backend
        run: |
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            mkdir -p "../../dist/$name"
            GOOS=linux GOARCH=arm64 go build -o "../../dist/$name/bootstrap" "./$cmd"
          done

      - name: Deploy infrastructure
        working-directory: packages/infrastructure
        run: |
          pnpm install --frozen-lockfile
          pnpm cdk deploy --all --require-approval never

      - name: Build frontend
        working-directory: packages/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_WS_ENDPOINT: ${{ secrets.VITE_WS_ENDPOINT }}
          VITE_API_ENDPOINT: ${{ secrets.VITE_API_ENDPOINT }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync packages/frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
